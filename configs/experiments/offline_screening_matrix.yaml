  density_doppler_gate:
    display_name: Density + Doppler + Gate
    radar_fusion_mode: density_doppler_gate
    role: candidate
matrix:
  baseline:
    'OFF': completed
    RF1: completed
    RF2: completed
    RF3: completed
  density:
    'OFF': completed
    RF1: completed
    RF2: completed
    RF3: completed
  density_doppler:
    'OFF': completed
    RF1: completed
    RF2: completed
    RF3: completed
  density_doppler_gate:
    'OFF': completed
    RF1: completed
    RF2: completed
    RF3: completed
